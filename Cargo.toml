[package]
name = "poler-harvest"
version = "0.96.1"
edition = "2021"
authors = ["Kotokvit / POLER Engineering Core"]
description = "Sovereign Ultra-Fast Filesystem Harvester & L1-L3 Address Crystal Scanner"
license = "MIT OR Apache-2.0"
repository = "https://github.com/poler-engine-org/poler-harvest"
keywords = ["search", "harvester", "filesystem", "fastcdc", "simd"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
memmap2 = "0.9"
libc = "0.2"
aho-corasick = "1.1"
ignore = "0.4"
regex = "1.10"
blake3 = "1.5"
zstd = { version = "0.13", features = ["pkg-config"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tar = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
